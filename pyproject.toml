[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-allocation-engine"
version = "0.1.0"
description = "Pre-processing quantization bit allocation engine based on statistical block profiling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]
bench = [
    "pytest-benchmark>=4.0",
]
eval = [
    "huggingface-hub>=1.0",
    "safetensors>=0.4",
]

[tool.setuptools]
packages = ["bit_allocation_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
